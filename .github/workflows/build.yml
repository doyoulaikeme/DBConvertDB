name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 5.0.x

      - name: Restore
        run: dotnet restore DBConvertDB.sln

      - name: Build
        run: dotnet build DBConvertDB.sln -c Release --no-restore
